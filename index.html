<div style="font-family: sans-serif; max-width: 100%; margin: 0 auto; text-align: center;">
  <div style="margin-bottom: 10px;">
    <input type="text" id="projectIdInput" placeholder="プロジェクトのIDまたはURLを入力..." style="width: 70%; padding: 8px; font-size: 14px; box-sizing: border-box;" />
    <button onclick="loadTurboWarp()" style="padding: 8px 15px; font-size: 14px; cursor: pointer; background-color: #4CAF50; color: white; border: none; border-radius: 4px;">読み込む</button>
  </div>
  
  <!-- 高さを少し広げ、プレイヤーがゆったり収まるように調整 -->
  <div style="position: relative; width: 100%; height: 500px; border: 1px solid #ccc; background: #f9f9f9;">
    <iframe id="targetFrame" src="" width="100%" height="100%" allowtransparency="true" frameborder="0" scrolling="no" allowfullscreen style="position: absolute; top: 0; left: 0;"></iframe>
  </div>
</div>

<script>
  function loadTurboWarp() {
    let inputVal = document.getElementById('projectIdInput').value.trim();
    const frame = document.getElementById('targetFrame');
    
    if (inputVal) {
      let match = inputVal.match(/\d+/g);
      
      if (match) {
        let projectId = match[match.length - 1];
        // プレイヤーのコントロールが確実に表示されるようにURLを設定
        frame.src = `https://turbowarp.org/${projectId}/embed?autoplay&controls`;
      } else {
        alert('有効なプロジェクトIDまたはURLを入力してください。');
      }
    } else {
      alert('プロジェクトIDまたはURLを入力してください。');
    }
  }

  document.getElementById('projectIdInput').addEventListener('keypress', function(event) {
    if (event.key === 'Enter') {
      loadTurboWarp();
    }
  });
</script>
